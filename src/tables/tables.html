<!DOCTYPE html>
<!-- Bases de données (type Baserow) : créer des bases et des tables typées,
     éditer lignes/colonnes, interroger en langage naturel (NL→SQL lecture seule)
     et exporter en CSV vers une sandbox. 100 % local (SQLite). -->
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumen — Bases de données</title>
    <script src="/lib/theme-init.js"></script>
    <link rel="stylesheet" href="../lib/tokens.css?v=5" />
    <link rel="stylesheet" href="../lib/ai-prompt.css?v=5" />
    <link rel="stylesheet" href="./styles.css?v=3" />
    <script type="module" src="./main.js" defer></script>
      <!-- Peau plate commune (jetons + effets neutralisés) : toujours en dernier. -->
    <link rel="stylesheet" href="/lib/flat.css?v=4" />
</head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/><path d="M3 12c0 1.66 4 3 9 3s9-1.34 9-3"/></svg></span>
          <div><div class="brand-title">Bases de données</div><div class="brand-sub" id="status">SQLite local</div></div>
        </div>
        <div class="spacer"></div>
        <select id="base-select" class="select" title="Base active"></select>
        <button class="btn" id="base-new" type="button">+ Base</button>
        <button class="btn ghost" id="base-del" type="button" title="Supprimer la base">🗑</button>
      </header>

      <div class="body">
        <aside class="sidebar">
          <div class="side-head"><span>Tables</span>
            <button class="icon-btn" id="table-new" type="button" title="Nouvelle table">+</button>
          </div>
          <ul class="table-list" id="table-list"></ul>
          <button class="btn ghost full" id="csv-import" type="button">Importer un CSV</button>
          <input type="file" id="csv-file" accept=".csv,text/csv" hidden />
        </aside>

        <main class="content">
          <div class="ai-bar">
            <input id="ai-q" class="ai-in" placeholder="Demandez à l'IA : « combien de lignes par catégorie ? »" autocomplete="off" />
            <button class="btn" id="ai-scope" type="button" title="Choisir les tables interrogées par l'IA">Portée : toute la base</button>
            <button class="btn primary" id="ai-go" type="button">Interroger l'IA</button>
          </div>

          <div class="grid-tools" id="grid-tools" hidden>
            <button class="btn" id="row-add" type="button">+ Ligne</button>
            <button class="btn" id="col-add" type="button">+ Colonne</button>
            <div class="spacer"></div>
            <button class="btn" id="conn-copy" type="button" hidden title="Recopier ce jeu dans une base locale pour l'éditer">Copier dans une base locale</button>
            <button class="btn ghost" id="csv-export" type="button">Exporter en CSV</button>
          </div>

          <div class="grid-wrap" id="grid-wrap">
            <p class="empty-note" id="empty">Créez une base puis une table pour commencer.</p>
          </div>
        </main>
      </div>
    </div>

    <div class="modal-backdrop" id="modal" hidden>
      <div class="modal" role="dialog" aria-modal="true">
        <div class="modal-head">
          <h4 id="modal-title">Résultat</h4>
          <button class="modal-close" id="modal-close" type="button" aria-label="Fermer">✕</button>
        </div>
        <div class="modal-body" id="modal-body"></div>
      </div>
    </div>
    <div class="toast" id="toast" hidden></div>
  </body>
</html>
