<!DOCTYPE html>
<!-- Boîte à outils Lumen : page intermédiaire (launcher) pour ouvrir les modules.
     Design Apple-friendly : fond dégradé doux, cartes en verre dégradé + halo. -->
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumen — Boîte à outils</title>
    <!-- Thème : suit le réglage clair/sombre de Lumen Desktop (dtTheme partagé via
         localStorage), avec repli sur le thème système. Appliqué tôt pour éviter
         tout flash. -->
    <script src="/lib/theme-init.js"></script>
<link rel="stylesheet" href="../lib/tokens.css?v=5" />
<style>
      /* ===== Palette : celle du système de conception (lib/tokens.css).
         La boîte à outils redéclarait la sienne — trois blocs clair/sombre —
         et ignorait donc la base et l'accent choisis dans les Réglages. Ne
         restent ici que les valeurs qui lui sont propres. ===== */
      :root {
        --text: var(--foreground);
        --muted: var(--muted-foreground);
        --surface: color-mix(in oklab, var(--card) 66%, transparent);
        --surface-hover: color-mix(in oklab, var(--card) 88%, transparent);
        --border-hover: color-mix(in oklab, var(--foreground) 16%, transparent);
        --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 10px 30px -18px rgba(0,0,0,0.28);
        --shadow-hover: 0 2px 6px rgba(0,0,0,0.06), 0 18px 40px -16px rgba(0,0,0,0.34);
        --bg: var(--background);
        --badge-bg: color-mix(in oklab, var(--foreground) 12%, transparent);
        --scroll: color-mix(in oklab, var(--foreground) 30%, transparent);
      }

      /* ===== Linux / WebKitGTK : backdrop-filter n'est PAS peint de façon fiable
         (cf. mémoire raspberry-pi-build : couches verre invisibles). On bascule
         donc sur des surfaces OPAQUES et on désactive le flou. Classe posée en JS
         d'après platform_flavor (rpi / linux-standard). ===== */
      :root.flavor-linux { --surface: #ffffff; --surface-hover: #f4f5f8; --border: rgba(0,0,0,0.1); --border-hover: rgba(0,0,0,0.18); }
      @media (prefers-color-scheme: dark) {
        :root.flavor-linux:not([data-dt-theme="light"]) { --surface: #232327; --surface-hover: #2b2b31; --border: rgba(255,255,255,0.1); --border-hover: rgba(255,255,255,0.2); }
      }
      :root.flavor-linux[data-dt-theme="dark"] { --surface: #232327; --surface-hover: #2b2b31; --border: rgba(255,255,255,0.1); --border-hover: rgba(255,255,255,0.2); }
      :root.flavor-linux .card { -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }

      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        font: 14px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
        color: var(--text); -webkit-font-smoothing: antialiased; user-select: none; overflow: hidden;
        background: var(--bg);
      }
      .wrap { height: 100vh; display: flex; flex-direction: column; padding: 24px 30px 12px; min-height: 0; }
      .head { display: flex; align-items: center; gap: 12px; margin-bottom: 2px; }
      .logo { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; color: #fff;
        background: linear-gradient(150deg, var(--c-a, #6a5cff), var(--c-b, #b65cff));
        box-shadow: 0 4px 12px -4px color-mix(in srgb, var(--c-a, #6a5cff) 60%, transparent), inset 0 1px 0 rgba(255,255,255,0.4); }
      .logo svg { width: 20px; height: 20px; }
      h1 { font-size: 21px; font-weight: 700; letter-spacing: -0.02em; margin: 0; }
      .sub { color: var(--muted); font-size: 12.5px; margin-top: 1px; }
      .grid {
        flex: 1; min-height: 0; overflow: auto; display: grid;
        grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 10px;
        align-content: start; margin-top: 14px; padding: 2px 4px 22px;
        scrollbar-gutter: stable;
      }
      .grid::-webkit-scrollbar { width: 10px; }
      .grid::-webkit-scrollbar-thumb { border-radius: 999px; background: var(--scroll); border: 3px solid transparent; background-clip: padding-box; }
      .grid::-webkit-scrollbar-track { background: transparent; }
      .card {
        position: relative; cursor: pointer; font: inherit; color: var(--text); text-align: left;
        grid-column: span 3; min-width: 0;
        border-radius: 16px; padding: 13px; display: flex; flex-direction: column; gap: 8px; min-height: 96px; overflow: hidden;
        background: var(--surface);
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        -webkit-backdrop-filter: blur(20px) saturate(160%); backdrop-filter: blur(20px) saturate(160%);
        transition: transform 0.2s cubic-bezier(0.2,0.8,0.2,1), border-color 0.2s, background 0.2s, box-shadow 0.2s;
      }
      .card:hover { transform: translateY(-3px); background: var(--surface-hover); border-color: var(--border-hover); box-shadow: var(--shadow-hover); }
      .card:active { transform: translateY(-1px) scale(0.99); }
      /* Carte principale (Lumen Desktop) : surface large avec un léger lavis de sa
         couleur d'accent, et un bouton « Entrer » teinté. Reste sobre. */
      .card.hero {
        grid-column: 1 / -1; min-height: 116px; padding: 17px 20px; gap: 6px;
        justify-content: flex-end;
      }
      .card.hero::before { content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none;
        background: radial-gradient(120% 140% at 100% 0%, color-mix(in srgb, var(--c1) 16%, transparent), transparent 60%); }
      .card.hero > * { position: relative; z-index: 1; }
      .card.hero .ic { width: 50px; height: 50px; border-radius: 15px; }
      .card.hero .ic svg { width: 28px; height: 28px; }
      .card.hero .nm { font-size: 20px; line-height: 1.1; }
      .card.hero .ds { max-width: 520px; font-size: 13px; line-height: 1.4; -webkit-line-clamp: 2; }
      .card.hero .enter {
        position: absolute; right: 20px; bottom: 20px; display: inline-flex; align-items: center; gap: 6px;
        border-radius: 999px; padding: 8px 14px; color: #fff;
        background: linear-gradient(140deg, var(--c1), var(--c2));
        font-size: 12px; font-weight: 650; letter-spacing: -0.01em;
        box-shadow: 0 4px 12px -4px color-mix(in srgb, var(--c1) 65%, transparent);
      }
      .card.major, .card.utility, .card.secondary { grid-column: span 3; min-height: 134px; padding: 13px; gap: 8px; }
      /* Tuile d'icône : seul élément réellement coloré (accent du module). */
      .ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex: none;
        background: linear-gradient(145deg, var(--c1), var(--c2)); color: #fff;
        box-shadow: 0 4px 12px -4px color-mix(in srgb, var(--c1) 55%, transparent), inset 0 1px 0 rgba(255,255,255,0.32); }
      .ic svg { width: 22px; height: 22px; }
      .nm { font-size: 14px; font-weight: 650; letter-spacing: -0.01em; color: var(--text); display: flex; align-items: center; gap: 7px; flex-wrap: nowrap; white-space: nowrap; min-width: 0; }
      .nm > :first-child { overflow: hidden; text-overflow: ellipsis; }
      .beta, .loop { flex: none; }
      .ds { font-size: 11.5px; line-height: 1.36; color: var(--muted); margin: 0;
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
      .beta, .loop { font-size: 9.5px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
        background: var(--badge-bg); border-radius: 20px; padding: 2px 8px; }
      .beta { color: color-mix(in srgb, var(--c1) 70%, var(--text)); }
      .loop { color: #0a7f57; }
      /* En-têtes de section (Cœur / Apps) : pleine largeur de la grille. */
      .section-head { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 10px; margin: 12px 2px 0; flex-wrap: wrap; }
      .section-head:first-child { margin-top: 0; }
      .section-title { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text); opacity: 0.55; }
      .section-desc { font-size: 12px; color: var(--muted); }
      /* En-tête d'un hub : une pastille en dégradé rappelle son identité, la
         même que celle des cartes en dessous et de l'icône dans le bureau. */
      .section-head.hub { position: relative; padding-left: 14px; }
      .section-head.hub::before {
        content: ""; position: absolute; left: 2px; top: 1px; bottom: 1px; width: 4px;
        border-radius: 3px; background: linear-gradient(160deg, var(--c1), var(--c2));
      }
      .section-head.hub .section-title { opacity: 0.95; }
      /* Carte mise en avant (boucle agentique) : fin liseré d'accent. */
      .card.featured { border-color: color-mix(in srgb, var(--c1) 45%, var(--border)); }
      .foot { margin-top: 14px; text-align: center; color: var(--muted); font-size: 12px; opacity: 0.8; }
      @media (max-width: 880px) {
        .wrap { padding: 28px 24px 16px; }
        .card, .card.utility, .card.secondary { grid-column: span 6; }
        .card.major { grid-column: span 6; }
      }
      @media (max-width: 560px) {
        .grid { grid-template-columns: 1fr; }
        .card, .card.hero, .card.major, .card.utility, .card.secondary { grid-column: 1 / -1; }
        .card.hero { min-height: 180px; padding: 20px; }
        .card.hero .enter { position: static; align-self: flex-start; margin-top: 2px; }
      }
    </style>
    <script type="module" defer>

      ];
      const svg = (inner) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
      // Couleurs des cartes : on puise dans la palette de l'orbe (identité Lumen)
      // au lieu des teintes propres à chaque carte. La hiérarchie visuelle reste
      // portée par les paliers (taille + désaturation via .utility/.secondary).
      const ORB_DEFAULT = ['#ff54a3', '#9961ff', '#47a3ff', '#61f2c7', '#ff9e6b'];
      function orbPalette() {
        try {
          const c = JSON.parse(localStorage.getItem('orbColors'));
          if (Array.isArray(c) && c.length === 5 && c.every((x) => /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(x))) return c;
        } catch {}
        return ORB_DEFAULT;
      }
      function launch(app) {
        invoke(app.cmd, app.args || {}).catch(() => {});
        try { window.__TAURI__.window.getCurrentWindow().close(); } catch {}
      }
      // Couleurs d'une carte : le dégradé du hub auquel l'outil appartient, ou
      // le sien s'il est autonome. C'est ce qui fait qu'une app porte la même
      // identité colorée ici, dans le launcher du bureau et dans le dock — au
      // lieu de la rotation de palette d'avant, qui donnait une couleur
      // différente selon la position dans la grille.
      function cardGradient(app, section) {
        if (section?.grad) return [section.grad[0], section.grad[1]];
        if (app.c1) return [app.c1, app.c2 || app.c1];
        const pal = orbPalette();
        return [pal[1], pal[2]];
      }
      function makeCard(app, section) {
        const card = document.createElement("button");
        card.className = ["card", app.tier || "", app.loop ? "featured" : ""].filter(Boolean).join(" ");
        let [c1, c2] = cardGradient(app, section);
        let c3 = c2;
        // Lumen Desktop (hero) : dégradé rouge dédié, dans le même style que les autres.
        if (app.tier === "hero") { c1 = "#ff5e3a"; c2 = "#ff2d55"; c3 = "#d11f44"; }
        card.style.setProperty("--c1", c1); card.style.setProperty("--c2", c2); card.style.setProperty("--c3", c3);
        const badge = app.loop ? '<span class="loop">Boucle</span>' : (app.beta ? '<span class="beta">Beta</span>' : '');
        card.innerHTML = `<span class="ic">${svg(app.icon)}</span>`
          + `<div class="nm">${app.name}${badge}</div>`
          + `<div class="ds">${app.desc}</div>`
          + (app.tier === "hero" ? '<span class="enter">Entrer dans Lumen Desktop →</span>' : '');
        card.addEventListener("click", () => launch(app));
        return card;
      }

        const grid = document.getElementById("grid");
        // Linux/WebKitGTK : surfaces opaques (backdrop-filter non peint). cf. CSS.
        try {
          const flavor = await invoke("platform_flavor");
          if (flavor === "rpi" || flavor === "linux-standard") document.documentElement.classList.add("flavor-linux");
        } catch {}
        const pal0 = orbPalette();
        document.documentElement.style.setProperty("--c-a", pal0[1]);
        document.documentElement.style.setProperty("--c-b", pal0[2]);
        // (L'Atelier des agents a été retiré des menus : cf. src-tauri/Cargo.toml,
        // feature `atelier` — le code reste, l'entrée non.)
        for (const sec of SECTIONS) {
          const items = APPS.filter((a) => a.section === sec.id);
          if (!items.length) continue;
          const head = document.createElement("div");
          head.className = "section-head" + (sec.grad ? " hub" : "");
          if (sec.grad) {
            head.style.setProperty("--c1", sec.grad[0]);
            head.style.setProperty("--c2", sec.grad[1]);
          }
          head.innerHTML = `<span class="section-title">${sec.title}</span><span class="section-desc">${sec.desc}</span>`;
          grid.appendChild(head);
          items.forEach((app) => grid.appendChild(makeCard(app, sec)));
        }
        translatePage(document);
      });
    </script>
      <!-- Peau plate commune (jetons + effets neutralisés) : toujours en dernier. -->

</head>
