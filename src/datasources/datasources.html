<!DOCTYPE html>
<!-- Sources de données (édition Pro) — le centre de connexions de Lumen :
     déclarer une base, un partage ou une API une fois, puis la mettre à
     disposition des apps Pro et des modèles en LECTURE SEULE, par une API REST
     locale doublée d'un point d'entrée MCP. -->
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumen — Sources de données</title>
    <script src="/lib/theme-init.js"></script>
    <link rel="stylesheet" href="../lib/tokens.css?v=5" />
    <link rel="stylesheet" href="./styles.css?v=2" />
    <script type="module" src="./main.js?v=1" defer></script>
    <link rel="stylesheet" href="../lib/confirm.css?v=1" />
    <link rel="stylesheet" href="/lib/flat.css?v=4" />
    <link rel="stylesheet" href="/lib/pro-skin.css?v=8" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-ic">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v6"/><circle cx="12" cy="12" r="3"/><path d="M12 15v6"/><path d="M4.6 7.5 9.4 10.3"/><path d="M14.6 13.7l4.8 2.8"/><path d="M19.4 7.5 14.6 10.3"/><path d="M9.4 13.7 4.6 16.5"/></svg>
          </span>
          <div><div class="brand-title">Sources</div><div class="brand-sub">Centre de connexions</div></div>
        </div>
        <nav class="nav" id="nav">
          <button data-view="sources" class="active"><span class="nav-ic" data-icon="plug"></span>Connexions</button>
          <button data-view="explore"><span class="nav-ic" data-icon="table"></span>Explorer</button>
          <button data-view="api"><span class="nav-ic" data-icon="waypoints"></span>API &amp; MCP</button>
        </nav>
        <div class="side-foot">
          <div class="dot-line"><span class="dot" id="server-dot"></span><span id="server-badge">API arrêtée</span></div>
          <div class="side-note">Tout ce qui sort d'ici est en lecture seule : l'API n'a aucune route d'écriture, et les outils MCP n'exposent que des lectures.</div>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div><h1 id="view-title">Connexions</h1><p id="view-sub">Vos bases, partages et API, déclarés une fois</p></div>
          <div class="top-actions" id="top-actions"></div>
        </header>

        <div class="scroll" id="scroll">
          <!-- ===== Connexions ===== -->
          <section class="view active" id="view-sources">
            <div class="split">
              <div class="card source-list">
                <div class="card-head"><span>Sources</span><button class="btn tiny primary" id="add-source">Ajouter</button></div>
                <div class="list" id="source-list"></div>
              </div>
              <div class="source-editor" id="source-editor"></div>
            </div>
          </section>

          <!-- ===== Explorer ===== -->
          <section class="view" id="view-explore">
            <div class="card">
              <div class="card-head">
                <span>Parcourir</span>
                <select class="select" id="explore-source"></select>
              </div>
              <div class="explore" id="explore"></div>
            </div>
          </section>

          <!-- ===== API & MCP ===== -->
          <section class="view" id="view-api">
            <div class="card">
              <div class="card-head"><span>Serveur local</span><button class="btn primary" id="server-start">Démarrer</button></div>
              <div class="card-body" id="server-body"></div>
            </div>
            <div class="card">
              <div class="card-head"><span>Surface exposée</span></div>
              <div class="card-body"><div class="routes" id="routes"></div></div>
            </div>
            <div class="card">
              <div class="card-head"><span>Brancher un client</span></div>
              <div class="card-body" id="samples"></div>
            </div>
          </section>
        </div>
      </main>
    </div>

    <div class="backdrop" id="backdrop" hidden></div>
    <div class="toast" id="toast" hidden></div>
  </body>
</html>
